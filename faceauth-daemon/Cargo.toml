[package]
name = "faceauth-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "faceauth system daemon: owns the camera and face models, serves D-Bus"

[[bin]]
name = "faceauth-daemon"
path = "src/main.rs"

[dependencies]
faceauth-common = { workspace = true }
faceauth-core = { workspace = true }
zbus = { workspace = true }
async-channel = "2"
async-io = "2"
blocking = "1"
futures-lite = "2"
