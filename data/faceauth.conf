# faceauth configuration. See faceauth.conf(5).
# Values shown are the built-in defaults; uncomment to change.

# PAM services that may use face authentication. Users can disable any of
# these for themselves ("faceauth service disable NAME") but cannot add
# others. The service must also load pam_faceauth.so in its auth stack; run
# "faceauth-setup configure" (in the libexec directory) as root after changes.
#
# Graphical login screens (gdm-password, sddm, lightdm, cosmic-greeter) are
# only used to unlock a locked session, never to log in: a face login does
# not provide the password needed to unlock the keyring/KWallet or an
# encrypted home directory. On GNOME, add gdm-password for face unlock; when
# the face is not recognized, the password prompt appears after "timeout".
#services = sudo, sudo-i, polkit-1, kde-fingerprint

# Maximum distance between a live face and an enrolled face (0.2 - 0.6).
# Lower is stricter: fewer false accepts, more retries.
#threshold = 0.45

# Consecutive frames that must each show exactly one matching face (1 - 10).
#required_matches = 3

# Default authentication timeout in seconds (1 - 30).
#timeout = 5

# Refuse cameras that are not greyscale-only (IR). Colour cameras can be
# fooled by a photo.
#require_ir = no
