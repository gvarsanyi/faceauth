<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
  "https://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- System bus policy for faceauth-daemon. Installed to
     /usr/share/dbus-1/system.d/. Per-method authorization is enforced by the
     daemon itself (SO_PEERCRED via the bus, polkit, logind). -->
<busconfig>
  <policy user="faceauthd">
    <allow own="io.github.gvarsanyi.FaceAuth1"/>
  </policy>

  <policy context="default">
    <allow send_destination="io.github.gvarsanyi.FaceAuth1"
           send_interface="io.github.gvarsanyi.FaceAuth1.Manager"/>
    <allow send_destination="io.github.gvarsanyi.FaceAuth1"
           send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="io.github.gvarsanyi.FaceAuth1"
           send_interface="org.freedesktop.DBus.Properties"/>
    <allow send_destination="io.github.gvarsanyi.FaceAuth1"
           send_interface="org.freedesktop.DBus.Peer"/>
  </policy>
</busconfig>
